{{- if eq .Values.workflows.engine "temporal" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "amax.name" . }}-temporal-worker
  labels: {{- include "amax.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal-worker
spec:
  replicas: {{ .Values.workflows.temporal.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: amax-temporal-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amax-temporal-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: temporal-worker
          image: "{{ .Values.image.repository }}:{{ .Values.workflows.temporal.worker.tag | default (printf "%s-temporal-worker" (.Values.image.tag | default .Chart.AppVersion)) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "amax.workflowsEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources: {{- toYaml .Values.workflows.temporal.worker.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
