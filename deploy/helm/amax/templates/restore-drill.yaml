{{- if .Values.backups.drill.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "amax.name" . }}-restore-drill
  labels: {{- include "amax.labels" . | nindent 4 }}
    app.kubernetes.io/component: restore-drill
spec:
  schedule: {{ .Values.backups.drill.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: amax-restore-drill
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: drill
              image: "{{ .Values.image.repository }}:{{ .Values.backups.drill.tag | default (printf "%s-ops" (.Values.image.tag | default .Chart.AppVersion)) }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "--import", "tsx", "--import", "./scripts/ignore-css.mjs", "scripts/backups.ts", "drill"]
              env:
                {{- include "amax.backupEnv" . | nindent 16 }}
              {{- with .Values.envFromSecret }}
              envFrom:
                - secretRef:
                    name: {{ . }}
              {{- end }}
              volumeMounts:
                {{- include "amax.backupMounts" . | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources: {{- toYaml .Values.backups.drill.resources | nindent 16 }}
          volumes:
            {{- include "amax.backupVolumes" . | nindent 12 }}
{{- end }}
