name: specclaw sync

# 039, 089: after changes to .specclaw on main, push the repo's specclaw state to the linked amax project through the
# sync_specclaw tool (POST /api/v1/tools/sync_specclaw), as an API credential acting for the project's PM. Without its
# secrets the job ends with a notice naming them; a refused or failed push fails the job. It runs after the merge, so a
# failed sync never blocks one.
#
# Secrets: AMAX_URL (e.g. https://amaxerp.com), AMAX_SYNC_API_KEY (create_api_credential with tools ["sync_specclaw"],
# scope delivery:write, acting for the PM), AMAX_SYNC_ACT_FOR (that PM's user id).
on:
  push:
    branches: [main]
    paths: [".specclaw/**"]
  workflow_dispatch:

permissions:
  contents: read

# One sync at a time: overlapping runs would race on the same proposals.
concurrency:
  group: specclaw-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push specclaw to amax (main, then each specclaw/* branch)
        env:
          AMAX_URL: ${{ secrets.AMAX_URL }}
          AMAX_SYNC_API_KEY: ${{ secrets.AMAX_SYNC_API_KEY }}
          AMAX_SYNC_ACT_FOR: ${{ secrets.AMAX_SYNC_ACT_FOR }}
        run: node scripts/specclaw-sync-ci.mjs
