version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # @types/node follows the Node runtime (24 LTS, see Dockerfile), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "@opennextjs/*", "wrangler"]
      test-tooling:
        patterns: ["vitest", "@playwright/test", "@axe-core/*", "pixelmatch", "pngjs", "@types/pngjs"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Production runs Node LTS (even majors); odd majors are short-lived.
      - dependency-name: node
        versions: ["25.x", "27.x", "29.x"]
